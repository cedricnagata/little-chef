AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LittleChef Serverless Backend - WebSocket Cooking Assistant and REST Recipe Parser

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: python3.12
    # Environment variables removed to preserve manually-set API keys during deployment
    Architectures:
      - x86_64

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment name (dev or prod)

  AllowedOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated list of allowed CORS origins (use * for dev)

Resources:
  # ===== WebSocket API (Cooking Assistant) =====

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'littlechef-websocket-${Environment}'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"
      Description: WebSocket API for real-time cooking assistance

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ConnectIntegration}'

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CookingAssistantFunction.Arn}/invocations'

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${DisconnectIntegration}'

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CookingAssistantFunction.Arn}/invocations'

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub 'integrations/${DefaultIntegration}'

  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CookingAssistantFunction.Arn}/invocations'

  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - ConnectRoute
      - DisconnectRoute
      - DefaultRoute
    Properties:
      ApiId: !Ref WebSocketApi

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      DeploymentId: !Ref WebSocketDeployment
      StageName: !Ref Environment
      Description: !Sub '${Environment} stage for WebSocket API'

  # ===== HTTP API (Recipe Parser) =====

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigins
        AllowHeaders:
          - Content-Type
          - X-Api-Key
          - Authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 600
      StageName: !Ref Environment

  # ===== Lambda Functions =====

  CookingAssistantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'littlechef-cooking-assistant-${Environment}'
      CodeUri: cooking_assistant/
      Handler: websocket_handler.handler
      Description: WebSocket-based cooking assistant with LangGraph and Polly TTS
      Timeout: 300
      MemorySize: 1024
      # Environment variables (OPENAI_API_KEY, etc.) are preserved from existing function config
      # They will not be overwritten during deployment
      Layers:
        - !Ref SharedLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: '*'

  CookingAssistantPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CookingAssistantFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  RecipeParserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'littlechef-recipe-parser-${Environment}'
      CodeUri: recipe_parser/
      Handler: handler.lambda_handler
      Description: Recipe parser supporting URL, text, and image inputs
      Timeout: 180
      MemorySize: 1024
      # Environment variables (OPENAI_API_KEY, FIRECRAWL_API_KEY, etc.) are preserved from existing function config
      # They will not be overwritten during deployment
      Layers:
        - !Ref SharedLayer
      Events:
        RecipeParserApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/parse
            Method: POST

  # ===== Lambda Layer for Shared Code =====

  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'littlechef-shared-${Environment}'
      Description: Shared schemas and utilities
      ContentUri: shared/
      CompatibleRuntimes:
        - python3.12
    Metadata:
      BuildMethod: python3.12

Outputs:
  WebSocketUrl:
    Description: WebSocket API endpoint URL for cooking assistant
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-WebSocketUrl'

  HttpApiUrl:
    Description: HTTP API endpoint URL for recipe parser
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-HttpApiUrl'

  RecipeParserEndpoint:
    Description: Recipe Parser endpoint
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/v1/parse'

  CookingAssistantFunctionArn:
    Description: Cooking Assistant Lambda Function ARN
    Value: !GetAtt CookingAssistantFunction.Arn

  RecipeParserFunctionArn:
    Description: Recipe Parser Lambda Function ARN
    Value: !GetAtt RecipeParserFunction.Arn
