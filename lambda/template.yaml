AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LittleChef Serverless Backend - Cooking Assistant and Recipe Parser

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        LOG_LEVEL: INFO
    Architectures:
      - x86_64

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment name (dev or prod)

  AllowedOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated list of allowed CORS origins (use * for dev)

Resources:
  # ===== API Gateway =====

  LittleChefApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigins
        AllowHeaders:
          - Content-Type
          - X-Api-Key
          - Authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 600
      StageName: !Ref Environment

  # ===== Lambda Functions =====

  CookingAssistantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'littlechef-cooking-assistant-${Environment}'
      CodeUri: cooking_assistant/
      Handler: handler.lambda_handler
      Description: LangGraph-based cooking assistant with timer tools
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          # API keys must be set manually via AWS CLI or Console after first deployment
          # They will persist across code deployments
          ENVIRONMENT: !Ref Environment
      Layers:
        - !Ref SharedLayer
      Events:
        CookingAssistantApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref LittleChefApi
            Path: /v1/assistant
            Method: POST

  RecipeParserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'littlechef-recipe-parser-${Environment}'
      CodeUri: recipe_parser/
      Handler: handler.lambda_handler
      Description: Recipe parser supporting URL, text, and image inputs
      Timeout: 180
      MemorySize: 1024
      Environment:
        Variables:
          # API keys must be set manually via AWS CLI or Console after first deployment
          # They will persist across code deployments
          FIRECRAWL_API_URL: https://api.firecrawl.dev/v1/scrape
          ENVIRONMENT: !Ref Environment
      Layers:
        - !Ref SharedLayer
      Events:
        RecipeParserApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref LittleChefApi
            Path: /v1/parse
            Method: POST

  # ===== Lambda Layer for Shared Code =====

  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'littlechef-shared-${Environment}'
      Description: Shared schemas and utilities
      ContentUri: shared/
      CompatibleRuntimes:
        - python3.12
    Metadata:
      BuildMethod: python3.12

Outputs:
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${LittleChefApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  CookingAssistantEndpoint:
    Description: Cooking Assistant endpoint
    Value: !Sub 'https://${LittleChefApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/v1/assistant'

  RecipeParserEndpoint:
    Description: Recipe Parser endpoint
    Value: !Sub 'https://${LittleChefApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/v1/parse'

  CookingAssistantFunctionArn:
    Description: Cooking Assistant Lambda Function ARN
    Value: !GetAtt CookingAssistantFunction.Arn

  RecipeParserFunctionArn:
    Description: Recipe Parser Lambda Function ARN
    Value: !GetAtt RecipeParserFunction.Arn
