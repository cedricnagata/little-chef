name: Deploy iOS to TestFlight

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Manual escape hatch: deploy the current main without merging a labelled PR.
  workflow_dispatch:

# Never let two uploads race for the same build number.
concurrency:
  group: testflight-ios
  cancel-in-progress: false

jobs:
  testflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'deploy-ios'))
    # Apple rejects uploads built with an SDK older than iOS 26, which ships in
    # Xcode 26. macos-15 images top out at Xcode 16 / iOS 18.5.
    runs-on: macos-26
    timeout-minutes: 60

    env:
      PROJECT: little-chef.xcodeproj
      SCHEME: little-chef
      BUILD_DIR: ${{ github.workspace }}/build
      ARCHIVE_PATH: ${{ github.workspace }}/build/little-chef.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export

    steps:
      - uses: actions/checkout@v4

      # Don't trust the image default — pin the newest Xcode 26 and fail loudly if the
      # image ever ships without one, rather than discovering it at the upload step.
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$APP" ]; then
            echo "::error::No Xcode 26 on this runner. Apple requires the iOS 26 SDK."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$APP"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      # The app and TimerWidgetExtension have distinct bundle IDs and therefore need
      # distinct profiles. xcodebuild command-line build settings apply to *every*
      # target at once, so manual signing cannot express that. Automatic signing lets
      # xcodebuild mint each profile via the App Store Connect API instead. The key is
      # written once here and reused by archive, export, and altool.
      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Automatic signing creates *profiles*, not certificates — the Apple Distribution
      # identity must already be in a keychain for codesign to find it.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # Ephemeral runner, ephemeral keychain — the password only guards this job.
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Lets codesign use the key without an interactive "allow" prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # Build numbers must strictly increase within a MARKETING_VERSION train.
          # Bump this if you ever upload by hand; reset to 0 when MARKETING_VERSION moves.
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || 0 }}
        run: |
          set -euo pipefail
          BUILD=$(( GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET ))
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "Archiving build $BUILD"

          # CURRENT_PROJECT_VERSION on the command line outranks the project setting.
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD"

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR"
          # signingStyle=automatic means no provisioningProfiles map: xcodebuild resolves
          # a profile per embedded bundle ID (app + TimerWidget) through the ASC API.
          # manageAppVersionAndBuildNumber=false stops export from rewriting our build number.
          cat > "$BUILD_DIR/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$BUILD_DIR/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # altool discovers the key by name in ~/private_keys.
          mkdir -p ~/private_keys
          cp "$ASC_KEY_PATH" ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

          IPA="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' | head -n 1)"
          echo "Uploading $IPA (build $BUILD)"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # A build Apple *rejected* is still inspectable this way. (Nothing is captured
      # if the archive itself failed.)
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/build/export/*.ipa
            ${{ github.workspace }}/build/little-chef.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up secrets
        if: always()
        run: |
          rm -f ~/private_keys/AuthKey_*.p8 "${ASC_KEY_PATH:-}"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
