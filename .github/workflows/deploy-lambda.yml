name: Deploy Lambda Functions

on:
  push:
    branches:
      - main
      - serverless-refactor
    paths:
      - 'lambda/**'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch:  # Allow manual triggering

env:
  AWS_REGION: us-east-1  # Change to your preferred region
  SAM_CLI_TELEMETRY: 0

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for AWS OIDC
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}  # Configure this in GitHub Secrets
          aws-region: ${{ env.AWS_REGION }}

      - name: SAM Build
        run: |
          cd lambda
          sam build --use-container

      - name: SAM Deploy
        run: |
          cd lambda
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name littlechef-backend-${{ github.ref_name }} \
            --parameter-overrides \
              Environment=${{ github.ref_name == 'main' && 'prod' || 'dev' }} \
            --capabilities CAPABILITY_IAM \
            --region ${{ env.AWS_REGION }}

      - name: Get API Gateway URL
        id: get-url
        run: |
          cd lambda
          API_URL=$(sam list stack-outputs \
            --stack-name littlechef-backend-${{ github.ref_name }} \
            --region ${{ env.AWS_REGION }} \
            --output json | jq -r '.[] | select(.OutputKey=="ApiGatewayUrl") | .OutputValue')
          echo "API_URL=$API_URL" >> $GITHUB_OUTPUT
          echo "::notice::API Gateway URL: $API_URL"

      - name: Deployment Summary
        run: |
          echo "### Deployment Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.ref_name == 'main' && 'Production' || 'Development' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "**API Gateway URL:** ${{ steps.get-url.outputs.API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Endpoints:**" >> $GITHUB_STEP_SUMMARY
          echo "- Cooking Assistant: \`POST ${{ steps.get-url.outputs.API_URL }}/v1/assistant\`" >> $GITHUB_STEP_SUMMARY
          echo "- Recipe Parser: \`POST ${{ steps.get-url.outputs.API_URL }}/v1/parse\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Update Lambda environment variables with API keys (OpenAI, ElevenLabs, Firecrawl)" >> $GITHUB_STEP_SUMMARY
          echo "2. Update iOS Config.plist with the API Gateway URL" >> $GITHUB_STEP_SUMMARY
